            "ar_fusha": "الصورة أعداد كثيرة",
            "en": "The Image Is Many Numbers",
          },
        "content":
          {
            "ar": "\u0643\u0644 \u0635\u0648\u0631\u0629 \u062d\u0648\u0644\u0643\u060c \u0645\u0646 \u0627\u0644\u062c\u0648\u0627\u0644 \u0644\u0644\u0622\u064a\u0628\u0627\u062f \u0644\u0644\u0625\u0646\u062a\u0631\u0646\u062a\u060c \u0647\u064a \u0623\u0631\u0642\u0627\u0645 \u0645\u0631\u062a\u0628\u0629 \u0641\u064a \u0635\u0641\u0648\u0641 \u0648\u0623\u0639\u0645\u062f\u0629. \u0627\u0644\u062a\u0631\u062a\u064a\u0628 \u0647\u0648 \u0627\u0644\u0644\u064a \u064a\u062e\u0644\u064a \u0627\u0644\u0623\u0631\u0642\u0627\u0645 \u062a\u0635\u064a\u0631 \u0635\u0648\u0631\u0629.",
            "ar_fusha": "\u0643\u0644 \u0635\u0648\u0631\u0629 \u062d\u0648\u0644\u0643\u060c \u0645\u0646 \u0627\u0644\u0647\u0627\u062a\u0641 \u0625\u0644\u0649 \u0627\u0644\u0622\u064a\u0628\u0627\u062f \u0648\u0627\u0644\u0625\u0646\u062a\u0631\u0646\u062a\u060c \u0647\u064a \u0623\u0631\u0642\u0627\u0645 \u0645\u0631\u062a\u0628\u0629 \u0641\u064a \u0635\u0641\u0648\u0641 \u0648\u0623\u0639\u0645\u062f\u0629. \u0627\u0644\u062a\u0631\u062a\u064a\u0628 \u0647\u0648 \u0645\u0627 \u064a\u062c\u0639\u0644 \u0627\u0644\u0623\u0631\u0642\u0627\u0645 \u062a\u0635\u0628\u062d \u0635\u0648\u0631\u0629.",
            "en": "Every picture around you, from phone to iPad to internet, is numbers arranged in rows and columns. The order is what turns the numbers into an image.",
          },
