            "en": "What Is Inside the Tung Tung Tung Sahur Image?",
          },
        "content":
          {
            "ar": "الصورة مكوّنة من مربعات صغيرة، وكل مربع له أرقام تحدد لونه. الحاسوب يحفظ هالأرقام في ذاكرته عشان يعرض الصورة أو يغيّرها أو يولد صورة جديدة.",
