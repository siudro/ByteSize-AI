    "one_concept": {
      "ar": "المصفوفة ترتّب الأعداد في صفوف وأعمدة. وضرب المصفوفات يربطها ويغيّرها.",
      "ar_fusha": "تنظّم المصفوفة الأعداد في صفوف وأعمدة، ويصل ضرب المصفوفات بينها ويحوّلها.",
      "en": "A matrix organizes numbers into meaningful rows and columns, and matrix multiplication connects or transforms them."
    },
    "learner_takeaway": {
      "ar": "ابنِ مصفوفة، وافهم خلية، واحسب خلية جديدة، ثم اربط ذلك بالذكاء الاصطناعي.",
