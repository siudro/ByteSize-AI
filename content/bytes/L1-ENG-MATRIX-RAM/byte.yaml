        "content":
          {
            "ar": "كنت مخطط انك تبني حاسوب ألعاب ولك فترة تجمع، ولما رحت تشوف السوق لقيت الأسعار طايرة، تتوقع وش السبب؟ هل تونغ تونغ تونغ سحور سبب هذه الكارثة؟",
            "ar_fusha": "كنت مخططًا لبناء حاسوب ألعاب ولديك فترة لتجميع المبلغ، وعندما ذهبت إلى السوق وجدت أسعار القطع مرتفعة جدًا، ما السبب برأيك؟ هل تونغ تونغ تونغ سحور هو سبب هذه الكارثة؟",
            "en": "You were planning to build a gaming computer and had been saving for a while. When you went to the market, you found that prices were sky-high. What do you think is the reason? Is Triple-T responsible for this disaster?",
