map:
  node_label:
    ar: البايت الأول
    en: First Byte
    ar_fusha: البايت الأول
  node_icon: spark
  pathway_color: gold
  position:
    level_band: 0
    order: 1
  unlocks:
    - L1-ENG-MATRIX-RAM
    - L1-ENG-01
    - L1-MAK-01
    - L1-CRE-01
    - L1-PRO-01
  connections:
    - target_byte_id: L1-ENG-MATRIX-RAM
      type: ladder
      reason:
        ar: فهم البيانات والأنماط يفتح طريق المصفوفات والحسابات في مسار المهندس.
        en: Understanding data and patterns opens the path to matrices and computation in the Engineering pathway.
        ar_fusha: فهم البيانات والأنماط يفتح طريق المصفوفات والحسابات في مسار المهندس.
    - target_byte_id: L1-ENG-01
      type: ladder
      reason:
        ar: فهم أساسيات البيانات والأنماط يفتح طريق بناء أنظمة الذكاء الاصطناعي.
        en: Understanding data and patterns opens the path to building AI systems.
        ar_fusha: فهم أساسيات البيانات والأنماط يفتح طريق بناء أنظمة الذكاء الاصطناعي.
    - target_byte_id: L1-MAK-01
      type: ladder
      reason:
        ar: فهم قدرات الذكاء الاصطناعي يفتح طريق التصميم والصناعة.
        en: Understanding AI capabilities opens the path to design and making.
        ar_fusha: فهم قدرات الذكاء الاصطناعي يفتح طريق التصميم والصناعة.
    - target_byte_id: L1-CRE-01
      type: ladder
      reason:
        ar: فهم التوليد والتحقق يفتح الطريق إلى الإبداع المسؤول.
        en: Understanding generation and verification opens the path to responsible creativity.
        ar_fusha: فهم التوليد والتحقق يفتح الطريق إلى الإبداع المسؤول.
    - target_byte_id: L1-PRO-01
      type: ladder
      reason:
        ar: فهم القرار والمسؤولية يفتح الطريق إلى الاستخدام المهني.
        en: Understanding decisions and accountability opens the professional pathway.
        ar_fusha: فهم القرار والمسؤولية يفتح الطريق إلى الاستخدام المهني.
badge:
  name:
    ar: مستكشف الذكاء الاصطناعي
    en: AI Explorer
    ar_fusha: مستكشف الذكاء الاصطناعي
  type: physical
  icon: media/images/badge-ai-explorer-placeholder.svg
  criteria:
    - ar: إكمال شاشات البايت الأساسية
      en: Complete the required Byte screens
      ar_fusha: إكمال شاشات البايت الأساسية
    - ar: إكمال مهمة مصمم نظام الذكاء الاصطناعي
      en: Complete the AI System Designer mission
      ar_fusha: إكمال مهمة مصمم نظام الذكاء الاصطناعي
    - ar: اختيار قرار الجاهزية
      en: Choose a readiness decision
      ar_fusha: اختيار قرار الجاهزية
learning_design:
  one_concept:
    ar: الذكاء الاصطناعي يتعلم أو يستخدم أنماطًا من البيانات ليلاحظ ويتنبأ ويوصي ويولّد ويتصرف، لكن جودة نتائجه ومسؤولية
      استخدامه تعتمدان على البشر والبيانات.
    en: AI learns or uses patterns in data to recognize, predict, recommend, generate, and act, while its quality and
      responsible use depend on people and data.
    ar_fusha: الذكاء الاصطناعي يتعلم أو يستخدم أنماطًا من البيانات ليلاحظ ويتنبأ ويوصي ويولّد ويتصرف، لكن جودة نتائجه
      ومسؤولية استخدامه تعتمدان على البشر والبيانات.
  project_output:
    ar: بطاقة نظام إنذار حريق ذكي توضّح الهدف والبيانات والنمط والنتيجة وضابط الأمان.
    en: A smart fire-warning system card showing the goal, data, pattern, output, and safeguard.
    ar_fusha: بطاقة نظام إنذار حريق ذكي توضّح الهدف والبيانات والنمط والنتيجة وضابط الأمان.
  concepts_taught:
    - ar: الذكاء الاصطناعي يحاكي بعض القدرات الذهنية البشرية، وليس عقلًا بشريًا كاملًا.
      en: AI imitates some human cognitive abilities; it is not a complete human mind.
      ar_fusha: الذكاء الاصطناعي يحاكي بعض القدرات الذهنية البشرية، وليس عقلًا بشريًا كاملًا.
    - ar: الذكاء الاصطناعي أوسع من المحتوى التوليدي.
      en: AI is broader than generative content.
      ar_fusha: الذكاء الاصطناعي أوسع من المحتوى التوليدي.
    - ar: قد يتعرف ويتنبأ ويوصي ويولّد ويتخذ إجراءات ضمن الصلاحيات الممنوحة له.
      en: It can recognize, predict, recommend, generate, and take actions within the authority it is given.
      ar_fusha: قد يتعرف ويتنبأ ويوصي ويولّد ويتخذ إجراءات ضمن الصلاحيات الممنوحة له.
    - ar: البيانات قد تكون أرقامًا أو صورًا أو فيديو أو صوتًا أو نصوصًا.
      en: Data can be numbers, images, video, audio, or text.
      ar_fusha: البيانات قد تكون أرقامًا أو صورًا أو فيديو أو صوتًا أو نصوصًا.
    - ar: الأنماط هي علاقات أو تكرارات تساعد النظام على التخمين.
      en: Patterns are relationships or repetitions that help a system make guesses.
      ar_fusha: الأنماط هي علاقات أو تكرارات تساعد النظام على التخمين.
    - ar: البيانات الناقصة أو غير المتوازنة قد تقود إلى استنتاجات خاطئة.
      en: Missing or unbalanced data can lead to wrong conclusions.
      ar_fusha: البيانات الناقصة أو غير المتوازنة قد تقود إلى استنتاجات خاطئة.
    - ar: المظهر الواقعي لا يثبت أن المحتوى حقيقي.
      en: Realistic appearance does not prove content is real.
      ar_fusha: المظهر الواقعي لا يثبت أن المحتوى حقيقي.
    - ar: الذكاء الاصطناعي قد يتخذ قرارات أو ينفذ أفعالًا، لكن البشر والجهات التي تصممه وتنشره وتستخدمه تبقى مسؤولة عن الضوابط
        والنتائج.
      en: AI may make decisions or take actions, but the people and organizations that design, deploy, and use it remain
        responsible for safeguards and outcomes.
      ar_fusha: الذكاء الاصطناعي قد يتخذ قرارات أو ينفذ أفعالًا، لكن البشر والجهات التي تصممه وتنشره وتستخدمه تبقى مسؤولة عن
        الضوابط والنتائج.
  learner_takeaway:
    ar: أستطيع أن أحدد ما يفعله نظام الذكاء الاصطناعي، وما البيانات التي يحتاجها، وما النمط الذي يبحث عنه، ومن المسؤول عن
      استخدامه.
    en: I can identify what an AI system does, what data it needs, what pattern it looks for, and who is responsible for its
      use.
    ar_fusha: أستطيع أن أحدد ما يفعله نظام الذكاء الاصطناعي، وما البيانات التي يحتاجها، وما النمط الذي يبحث عنه، ومن المسؤول
      عن استخدامه.
audience:
  minimum_age: 10
  prerequisites:
    - ar: لا توجد متطلبات سابقة
      en: No prerequisites
      ar_fusha: لا توجد متطلبات سابقة
  accessibility_notes:
    - ar: لا يحتاج إلى برمجة
      en: No coding required
      ar_fusha: لا يحتاج إلى برمجة
    - ar: كل شاشة تحتوي على عنصر جذب بصري أو تفاعل
      en: Every screen includes a visual or interactive attention anchor
      ar_fusha: كل شاشة تحتوي على عنصر جذب بصري أو تفاعل
    - ar: سؤال كتابي واحد فقط في نهاية البايت
      en: Only one written reflection appears near the end
      ar_fusha: سؤال كتابي واحد فقط في نهاية البايت
    - ar: معظم الأسئلة تحتوي على خيارين أو ثلاثة خيارات قصيرة
      en: Most questions use two or three short options
      ar_fusha: معظم الأسئلة تحتوي على خيارين أو ثلاثة خيارات قصيرة
experience_style:
  format: duolingo_pages
  pacing: one_idea_or_decision_per_screen
  reading_level:
    ar: قصير وواضح وغير طفولي
    en: Short, clear, and not childish
    ar_fusha: قصير وواضح وغير طفولي
  tone:
    ar: فضولي، ذكي، خفيف، ومباشر
    en: Curious, smart, light, and direct
    ar_fusha: فضولي، ذكي، خفيف، ومباشر
  interaction_density: very_high
  maximum_seconds_without_interaction: 40
  content_rules:
    - No learner screen may contain text only.
    - Every screen must include media, sound, a quiz, a reveal, or an interactive task.
    - Answer labels should usually be two to five words.
    - Do not show feedback before the learner selects an answer.
