- id: pattern_definition
  type: concept
  title:
    ar: وش يعني نمط؟
    en: What Is a Pattern?
  content:
    ar: النمط تكرار أو علاقة تظهر في البيانات وتساعد النظام على التخمين.
    en: A pattern is a repetition or relationship in data that helps a system make a guess.
  media:
  - type: image
    ref: pattern_sort
- id: pattern_cats_screen
  type: story
  title:
    ar: نمط في الصور
    en: A Pattern in Images
  content:
    ar: قد يلاحظ النظام آذانًا وشوارب وأشكالًا تتكرر في صور القطط.
    en: A system may notice ears, whiskers, and shapes recurring in cat images.
  media:
  - type: image
    ref: pattern_cats
- id: pattern_traffic_screen
  type: story
  title:
    ar: نمط في الوقت
    en: A Pattern in Time
  content:
    ar: قد يتكرر الزحام قرب المدارس في وقت محدد كل صباح.
    en: Traffic may repeat near schools at a certain time each morning.
  media:
  - type: image
    ref: pattern_traffic
- id: pattern_quiz
  type: exercise
  title:
    ar: لقطت النمط؟
    en: Did You Spot the Pattern?
  question:
    ar: زحام يتكرر كل يوم الساعة 7:30. ما النمط؟
    en: Traffic repeats every day at 7:30. What is the pattern?
  options:
  - id: time
    label:
      ar: الوقت
      en: Time
  - id: color
    label:
      ar: لون السيارات
      en: Car color
  correct_answer: time
  feedback:
    correct:
      ar: صح. العلاقة المتكررة هنا مرتبطة بالوقت.
      en: Correct. The recurring relationship is linked to time.
    incorrect:
      ar: ركّز على الشيء الذي يتكرر يوميًا.
      en: Focus on what repeats every day.
- id: pattern_detective_spam
  type: exercise
  title:
    ar: 'القضية الأولى: الرسائل'
    en: 'Case One: Messages'
  question:
    ar: رسائل كثيرة مزعجة تحتوي على «اربح الآن» وروابط غريبة. ما النمط؟
    en: Many spam messages contain “win now” and unusual links. What is the pattern?
  options:
  - id: phrases_links
    label:
      ar: عبارات وروابط متكررة
      en: Repeated phrases and links
  - id: message_color
    label:
      ar: لون الرسالة
      en: Message color
  correct_answer: phrases_links
  feedback:
    correct:
      ar: بالضبط. النظام قد يتعلم من الكلمات والروابط المتكررة.
      en: Exactly. The system may learn from recurring words and links.
    incorrect:
      ar: ركّز على الشيء المشترك بين الرسائل المزعجة.
      en: Focus on what the spam messages have in common.
- id: pattern_detective_traffic
  type: exercise
  title:
    ar: 'القضية الثانية: الزحام'
    en: 'Case Two: Traffic'
  question:
    ar: الزحام يزيد قرب المدرسة كل يوم بين 6 و 7 صباحًا. ما النمط؟
    en: Traffic rises near the school every day between 6 and 7 a.m. What is the pattern?
  options:
  - id: time_place
    label:
      ar: الوقت والمكان
      en: Time and place
  - id: car_shape
    label:
      ar: شكل السيارات
      en: Car shape
  correct_answer: time_place
  feedback:
    correct:
      ar: صح. الزيادة مرتبطة بوقت ومكان محددين.
      en: Correct. The increase is linked to a specific time and place.
    incorrect:
      ar: 'اسأل: متى وأين يتكرر الزحام؟'
      en: 'Ask: when and where does the traffic repeat?'
- id: pattern_detective_health
  type: exercise
  title:
    ar: 'القضية الثالثة: الصحة'
    en: 'Case Three: Health'
  question:
    ar: 'عند عدد من المرضى تكرر: حرارة مرتفعة، سعال، وانخفاض الأكسجين. ما النمط؟'
    en: Across several patients, high temperature, cough, and low oxygen repeat. What is the pattern?
  options:
  - id: symptoms_together
    label:
      ar: مؤشرات تظهر معًا
      en: Indicators appearing together
  - id: patient_names
    label:
      ar: أسماء المرضى
      en: Patient names
  correct_answer: symptoms_together
  feedback:
    correct:
      ar: صح. النظام يلاحظ مجموعة مؤشرات تتكرر معًا، ثم ينبه المختص.
      en: Correct. The system notices indicators recurring together, then alerts a specialist.
    incorrect:
      ar: الأسماء لا تصف الحالة؛ المؤشرات المتكررة هي المهمة.
      en: Names do not describe the condition; the recurring indicators matter.
- id: data_quality
  type: concept
  title:
    ar: الكثرة مو كل شيء
    en: More Is Not Always Better
  content:
    ar: حتى لو كانت البيانات كثيرة، لازم تكون متنوعة وتمثل الواقع.
    en: Even with lots of data, it must be diverse and represent reality.
  media:
  - type: image
    ref: diverse_examples
- id: survivorship_story
  type: story
  title:
    ar: لغز من الحرب العالمية
    en: A World War II Puzzle
  content:
    ar: درس الباحثون الطائرات التي رجعت من المعارك، ولاحظوا أماكن ثقوب الرصاص.
    en: Researchers studied planes that returned from battle and marked their bullet holes.
  media:
  - type: image
    ref: survivorship_planes
- id: survivorship_choice
  type: exercise
  title:
    ar: وين تحط الدرع؟
    en: Where Would You Add Armor?
  question:
    ar: أي منطقة تحمي أكثر؟
    en: Which area would you protect more?
  options:
  - id: many_holes
    label:
      ar: حول الثقوب
      en: Around the holes
  - id: few_holes
    label:
      ar: الأماكن السليمة
      en: The untouched areas
  correct_answer: few_holes
  feedback:
    correct:
      ar: بالضبط. الطائرات المصابة هناك غالبًا لم ترجع.
      en: Exactly. Planes hit there often did not return.
    incorrect:
      ar: فكّر بالطائرات التي لم نرها لأنها لم تعد.
      en: Think about the planes we never saw because they did not return.
- id: survivorship_reveal_screen
  type: story
  title:
    ar: المعلومة الناقصة غيّرت القرار
    en: The Missing Information Changed the Decision
  content:
    ar: الطائرات العائدة نجت رغم إصابة مناطق معيّنة. الخطر الحقيقي كان في أماكن إصابة الطائرات التي لم تعد.
    en: Returning planes survived hits in certain areas. The critical areas were where missing planes had been hit.
  media:
  - type: image
    ref: survivorship_reveal
- id: survivorship_simple
  type: concept
  title:
    ar: هذا هو تحيّز الناجين
    en: This Is Survivorship Bias
  content:
    ar: إذا نظرنا فقط إلى من نجح أو بقي، يمكن نفهم القصة بشكل غلط.
    en: If we only look at those who succeeded or remained, we may misunderstand the story.
  media:
  - type: image
    ref: missing_data_kids
- id: survivorship_kids_quiz
  type: exercise
  title:
    ar: وش الناقص؟
    en: What Is Missing?
  question:
    ar: درست أفضل مشاريع المسابقة فقط. وش ينقصك لتفهم سبب النجاح؟
    en: You studied only the best competition projects. What is missing?
  options:
  - id: failed
    label:
      ar: المشاريع التي تعثرت
      en: Projects that struggled
  - id: more_winners
    label:
      ar: فائزون أكثر
      en: More winners
  correct_answer: failed
  feedback:
    correct:
      ar: صح. المقارنة مع التعثر تكشف عوامل النجاح الحقيقية.
      en: Correct. Comparing with struggles reveals the real success factors.
    incorrect:
      ar: رؤية الفائزين فقط تعطيك نصف القصة.
      en: Seeing only winners gives you half the story.
- id: survivorship_ai_link
  type: concept
  title:
    ar: وهنا يدخل الذكاء الاصطناعي
    en: Now Connect It to AI
  content:
    ar: إذا لم تصل للنظام أمثلة مهمة، سيتعلم من نصف القصة فقط.
    en: If important examples never reach the system, it learns from only half the story.
  media:
  - type: image
    ref: diverse_examples
- id: generated_media_joke
  type: story
  title:
    ar: يمكن ما اختفى...
    en: Maybe It Did Not Disappear...
  content:
    ar: 'تقول: أخيرًا اختفى المحتوى المولّد! بس يمكن ما اختفى... يمكن صار متقن لدرجة إنك ما عدت تميّزه. '
    en: 'You say: AI-generated content finally disappeared! But maybe it did not... maybe it became so convincing
      that you no longer notice it. '
  media:
