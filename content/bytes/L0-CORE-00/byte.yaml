makerspace_integration:
  required: false
  environment_tasks:
  - ar: يمكن للمتعلم لاحقًا البحث عن مثال حقيقي للذكاء الاصطناعي داخل مساحة الابتكار.
    en: Learners may later look for a real AI example inside the makerspace.
  hardware:
  - name:
      ar: محطة الشارات
      en: Badge station
    required: true
    purpose:
      ar: منح الشارة بعد إكمال البايت.
      en: Award the badge after completing the Byte.
screens:
- id: intro
  type: story
  title:
    ar: "ابدأ من هنا"
    en: "Start Here"
  content:
    ar: "هذا هو البايت الأول في رحلتك. خذ وقتك، فكل شاشة تعطيك فكرة صغيرة وواضحة."
    en: "This is the first Byte in your journey. Take your time; each screen gives you one small, clear idea."
  bullets:
    - ar: "ستتعلم ما هو الذكاء الاصطناعي، وما الذي لا يُعد ذكاءً اصطناعيًا."
      en: "You will learn what AI is, and what does not count as AI."
    - ar: "ستفهم كيف تستخدم الأنظمة البيانات والأنماط للتعرّف والتنبؤ والتوصية والتوليد والتصرف."
      en: "You will see how systems use data and patterns to recognize, predict, recommend, generate, and act."
    - ar: "ستعرف لماذا نتحقق من النتائج والمصادر، ومن يتحمل مسؤولية الاستخدام."
      en: "You will learn why we verify outputs and sources, and who is responsible for use."
    - ar: "في النهاية، ستشرح الفكرة لشخص جديد على الموضوع."
      en: "At the end, you will explain the idea to someone new to the topic."
    - ar: "عند إكمال البايت، ستحصل على شارة مستكشف الذكاء الاصطناعي."
      en: "When you complete the Byte, you will earn the AI Explorer badge."
  media:
    - type: image
      ref: ai_world_hook

- id: intro_guess
  type: micro_check
  title:
      ar: "تخمين سريع"
      en: "Quick Guess"
  question:
      ar: "هل الذكاء الاصطناعي يعني صناعة الصور والنصوص فقط؟"
      en: "Is AI only about making images and text?"
  options:
      - id: yes
        label:
          ar: "نعم"
          en: "Yes"
      - id: no
        label:
          ar: "لا"
          en: "No"
  correct_answer: no
  feedback:
      correct:
        ar: "صحيح. التوليد قدرة واحدة فقط من قدرات كثيرة."
        en: "Correct. Generation is only one of many capabilities."
      incorrect:
        ar: "فيه أكثر بكثير: يتعرف ويتنبأ ويوصي ويتصرف أيضًا."
        en: "There is much more: AI also recognizes, predicts, recommends, and acts."

- id: ai_definition
  type: concept
  title:
    ar: وش يعني ذكاء اصطناعي؟
    en: What Does AI Mean?
  content:
    ar: "أنظمة تحاكي بعض قدرات الإنسان، مثل التعلّم والتعرّف والتوقّع والتوليد واتخاذ القرار. ونتائجها ليست ثابتة دائمًا؛ فقد تتغيّر حسب البيانات والسياق."
    en: "Systems that imitate some human abilities, such as learning, recognizing, predicting, generating, and making decisions. Their results are not always fixed and may change with the data and context."
  media:
  - type: image
    ref: ai_capabilities

- id: ai_definition
  type: reflection
  title:
    ar: أمثلة أخرى؟
    en: More example?
  prompt:
    ar: أضف أمثلة أخرى لقدرات الذكاء الاصطناعي من حولك. 
    en: Add more examples of AI capabilities from the world around you.
  placeholder:
    ar: 'مثال: أتحقق من المعلومات...'
    en: 'Example: I would verify the information...'
  minimum_characters: 8
  required: true

- id: ai_history
  type: story
  title:
    ar: الفكرة أقدم مما تتوقع
    en: Older Than You Think
  content:
    ar: ظهر اسم «الذكاء الاصطناعي» كمجال علمي في لقاء دارتموث عام 1956.
    en: The name “artificial intelligence” emerged as a scientific field at Dartmouth in 1956.
  media:
  - type: image
    ref: dartmouth_1956
- id: not_every_software
  type: concept
  title:
    ar: "مو كل برنامج ذكاء اصطناعي"
    en: "Not Every Program Is AI"
  content:
    ar: "الآلة الحاسبة والمنبّه ومفتاح المصباح تعمل بناءً على برمجة وتعليمات ثابتة: إذا كررت نفس الأمر، تحصل عادةً على النتيجة نفسها. أما الذكاء الاصطناعي فيعتمد على البيانات والأنماط، لذلك قد تتغيّر نتائجه حسب البيانات والسياق."
    en: "A calculator, alarm, and light switch work through programming and fixed instructions: repeat the same command, and you usually get the same result. AI, however, relies on data and patterns, so its results may change depending on the data and context."
  media:
  - type: image
    ref: fixed_rules
- id: ai_or_not
  type: exercise
  title:
    ar: "أي واحد يستخدم الذكاء الاصطناعي؟"
    en: "Which One Uses AI?"
  question:
    ar: "أي مثال يعتمد على البيانات والأنماط؟"
    en: "Which example depends on data and patterns?"
  options:
    - id: calculator
      label:
        ar: "آلة حاسبة"
        en: "Calculator"
    - id: face_unlock
      label:
        ar: "فتح الجوال بالوجه"
        en: "Face unlock"
  correct_answer: face_unlock
  feedback:
    correct:
      ar: "صح. فتح الجوال بالوجه يعتمد على التعرّف على أنماط في الصورة."
      en: "Correct. Face unlock recognizes patterns in an image."

    incorrect:
      ar: "الآلة الحاسبة تتبع قواعد ثابتة، ولا تحتاج أن تتعرّف على نمط."
      en: "A calculator follows fixed rules and does not need to recognize a pattern."
- id: capability_recognize
  type: story
  title:
    ar: الذكاء الاصطناعي يتعرّف
    en: AI Recognizes
  content:
    ar: السيارة الذاتية القيادة تتعرّف على الطريق والمشاة والإشارات.
    en: A self-driving car recognizes roads, pedestrians, and signs.
  media:
  - type: image
    ref: self_driving_car
- id: capability_predict
  type: story
  title:
    ar: الذكاء الاصطناعي يتنبأ
    en: AI Predicts
  content:
    ar: أنظمة الكوارث تحلل صور الأقمار والمجسات لتتوقع حريقًا أو فيضانًا مبكرًا.
    en: Disaster systems analyze satellite and sensor data to predict fires or floods early.
  media:
  - type: image
    ref: disaster_detection

- id: capability_view_car
  type: story
  title:
    ar: 'مثال ذكاء اصطناعي: سيارة ذكية'
    en: 'AI Example: Smart Cars'
  content:
    ar: رأت السيارة شخص يقطع الشارع
    en: The car sees a person crossing the road.
  media:
  - type: image
    ref: self_driving_car
- id: capability_quiz_car_action
  type: exercise
  title:
    ar: وش تسوي السيارة؟
    en: What Does the Car Do?
  question:
    ar: بعد أن رأت الشخص، ضغط النظام على الفرامل. ما الوظيفة التي يقوم بها الذكاء الاصطناعي هنا؟
    en: After seeing the person, the system applied the brakes. What is the AI task here?
  options:
  - id: act
    label:
      ar: يتصرف
      en: Act
  - id: generate
    label:
      ar: يولّد
      en: Generate
  correct_answer: act
  feedback:
    correct:
      ar: صح. النظام نفّذ فعلًا في العالم الحقيقي.
      en: Correct. The system took an action in the real world.
    incorrect:
      ar: هو لم يصنع محتوى؛ بل نفّذ قرارًا بالفرملة.
      en: It did not create content; it acted by braking.
- id: capability_view_recommendation
  type: story
  title:
    ar: 'مثال ذكاء اصطناعي: توصيات جديدة'
    en: 'AI Example: A New recommendation'
  content:
    ar: التطبيق لاحظ ما شاهدته سابقًا، ثم عرض لك مقطعًا قد يعجبك.
    en: The app noticed what you watched before, then showed you a clip you may like.
  media:
  - type: image
    ref: recommendation
- id: capability_quiz_recommendation
  type: exercise
  title:
    ar: وش يسوي التطبيق؟
    en: What Is the App Doing?
  question:
    ar: ما المهمة الأساسية للذكاء الاصطناعي في هذا التطبيق؟
    en: What is the main AI task in this app?
  options:
  - id: recommend
    label:
      ar: يوصي
      en: Recommend
  - id: recognize
    label:
      ar: يتعرّف
      en: Recognize
  correct_answer: recommend
  feedback:
    correct:
      ar: صح. اختار لك شيئًا قد يناسبك.
      en: Correct. It selected something you may like.
    incorrect:
      ar: هو يستخدم ما يعرفه عن تفضيلاتك ليقترح شيئًا.
      en: It uses your preferences to suggest something.
- id: capability_view_fraud
  type: story
  title:
    ar: 'عملية غريبة'
    en: 'Example 3: An Unusual Transaction'
  content:
    ar: نظام الذكاء الاصطناعي لاحظ أن عملية الدفع مختلفة جدًا عن عادات صاحب الحساب.
    en: The AI system notices that a payment is very different from the account holder’s usual behavior.
  media:
  - type: image
    ref: fraud_detection
- id: capability_quiz_fraud
  type: exercise
  title:
    ar: وش مهمة الذكاء الاصطناعي في نظام البنك؟
    en: What Is the AI task in this bank system?
  question:
    ar: ما المهمة الأساسية؟
    en: What is the main task?
  options:
  - id: recognize
    label:
      ar: يتعرّف
      en: Recognize
  - id: generate
    label:
      ar: يولّد
      en: Generate
  correct_answer: recognize
  feedback:
    correct:
      ar: صح. تعرّف على سلوك غير معتاد.
      en: Correct. It recognized unusual behavior.
    incorrect:
      ar: لم ينشئ شيئًا جديدًا؛ بل اكتشف اختلافًا في البيانات.
      en: It did not create something new; it detected a difference in the data.
- id: data_definition
  type: concept
  title:
    ar: طيب، وش هي البيانات؟
    en: So, What Is Data?
  content:
    ar: 'البيانات هي المعلومات التي يتعامل معها الذكاء الاصطناعي: أرقام مثل الحرارة والنبض، وصور وفيديو، وأصوات
      وكلام، ونصوص نكتبها ونقرأها.'
    en: 'Data is the information AI works with: numbers such as temperature and heart rate, images and video, sounds
      and speech, and text we write and read.'
  media:
  - type: image
    ref: data_types
- id: data_type_quiz_numbers
  type: exercise
  title:
    ar: خمّن نوع البيانات
    en: Guess the Data Type
  question:
    ar: قياسات نبض القلب تعد ...
    en: Heart rate measurements are...
  options:
  - id: numbers
    label:
      ar: أرقام
      en: Numbers
  - id: images
    label:
      ar: صور
      en: Images
  correct_answer: numbers
  feedback:
    correct:
      ar: صح. هي قياسات رقمية.
      en: Correct. They are numerical measurements.
    incorrect:
      ar: هي قيم يمكن قياسها بالأرقام.
      en: They are values measured as numbers.
- id: data_type_quiz_camera
  type: exercise
  title:
    ar: خمّن نوع البيانات
    en: Guess the Data Type
  question:
    ar: كاميرا السيارة ترسل للنظام...
    en: The car camera sends the system...
  options:
  - id: visual
    label:
      ar: صور وفيديو
      en: Images and video
  - id: audio
    label:
      ar: صوت
      en: Audio
  correct_answer: visual
  feedback:
    correct:
      ar: صحيح. الكاميرا تنتج بيانات بصرية.
      en: Correct. A camera produces visual data.
    incorrect:
      ar: الكاميرا تنقل ما تراه.
      en: A camera sends what it sees.

- id: data_sort_temperature
  type: exercise
  title:
    ar: درجة الحرارة
    en: Temperature
  question:
    ar: درجة الحرارة تنتمي إلى أي نوع؟
    en: Which type does temperature belong to?
  options:
  - id: numbers
    label:
      ar: أرقام
      en: Numbers
  - id: images
    label:
      ar: صور
      en: Images
  correct_answer: numbers
  feedback:
    correct:
      ar: صح. هي قيمة رقمية قابلة للقياس.
      en: Correct. It is a measurable numerical value.
    incorrect:
      ar: درجة الحرارة تُسجل كرقم.
      en: Temperature is recorded as a number.
- id: data_sort_xray
  type: exercise
  title:
