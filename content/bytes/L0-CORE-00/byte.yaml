learner_feedback:
  readiness_check:
    required: true
    appears_after: connect_leads
    title:
      ar: هل تشعر أنك جاهز للخطوة التالية؟
      en: Do you feel ready for the next step?
      ar_fusha: هل تشعر أنك جاهز للخطوة التالية؟
    prompt:
      ar: وش تبي تسوي الآن؟
      en: What would you like to do now?
      ar_fusha: ماذا تريد أن تفعل الآن؟
    options:
      - id: ready
        label:
          ar: جاهز أكمل
          en: Ready to continue
          ar_fusha: جاهز للمتابعة
        action: continue_to_unlocked_bytes
        result_message:
          ar: تم. المستوى الأول مفتوح.
          en: Done. Level 1 is unlocked.
          ar_fusha: تم. المستوى الأول مفتوح.
      - id: review
        label:
          ar: أراجع البايت
          en: Review the Byte
          ar_fusha: أريد مراجعة البايت
        action: restart_byte_or_review_mode
        result_message:
          ar: أكيد. راجع اللي تحتاجه بدون ما يروح تقدمك.
          en: Of course. Review what you need without losing progress.
          ar_fusha: بالطبع. راجع ما تحتاج إليه دون أن تفقد تقدمك.
      - id: unsure
        label:
          ar: أبغى ملخص
          en: Show me a recap
          ar_fusha: أريد ملخصًا
        action: show_quick_recap
        result_message:
          ar: "تذكّر: وش الهدف؟ وش البيانات؟ وش النمط؟ وش ضابط الأمان؟"
          en: "Remember: what is the goal, data, pattern, and safety check?"
          ar_fusha: "تذكّر: ما الهدف؟ ما البيانات؟ ما النمط؟ ما ضابط الأمان؟"
    self_decision_note:
      ar: ما فيه اختيار غلط هنا.
      en: There is no wrong choice here.
      ar_fusha: لا يوجد اختيار خاطئ هنا.
facilitator_notes:
  setup_time_minutes: 8
  materials:
    - ar: جهاز لوحي أو لابتوب وسماعات عند الحاجة
      en: Tablet or laptop, with headphones if needed
      ar_fusha: جهاز لوحي أو حاسوب محمول وسماعات عند الحاجة
    - ar: شارة مستكشف الذكاء الاصطناعي
      en: AI Explorer badge
      ar_fusha: شارة مستكشف الذكاء الاصطناعي
  delivery_notes:
    - ar: لا تعرض شاشة بلا صورة أو صوت أو تفاعل.
      en: Do not present a screen without an image, sound, or interaction.
      ar_fusha: لا تعرض شاشة بلا صورة أو صوت أو تفاعل.
    - ar: لا تقرأ النصوص للمتعلم؛ دع الشاشة تقوده.
      en: Do not read the text to the learner; let the screen guide them.
      ar_fusha: لا تقرأ النصوص للمتعلم؛ دع الشاشة تقوده.
    - ar: في قصة الطائرات، دع المتعلم يختار قبل الكشف.
      en: In the plane story, let the learner choose before the reveal.
      ar_fusha: في قصة الطائرات، دع المتعلم يختار قبل الكشف.
    - ar: في أسئلة الحقيقي والمولّد، لا تُظهر الحل قبل الاختيار.
      en: In real-versus-generated questions, do not reveal the answer before selection.
      ar_fusha: في أسئلة الحقيقي والمولّد، لا تُظهر الحل قبل الاختيار.
  common_misconceptions:
    - misconception:
        ar: الذكاء الاصطناعي يعني ChatGPT وصناعة الصور فقط.
        en: AI only means ChatGPT and image generation.
        ar_fusha: الذكاء الاصطناعي يعني ChatGPT وصناعة الصور فقط.
      correction:
        ar: الذكاء الاصطناعي يتعرف ويتنبأ ويوصي ويكتشف ويتصرف أيضًا.
        en: AI also recognizes, predicts, recommends, detects, and acts.
        ar_fusha: الذكاء الاصطناعي يتعرف ويتنبأ ويوصي ويكتشف ويتصرف أيضًا.
    - misconception:
        ar: كل برنامج ذكاء اصطناعي.
        en: Every program is AI.
        ar_fusha: كل برنامج ذكاء اصطناعي.
      correction:
        ar: البرامج التقليدية تتبع تعليمات ثابتة، بينما تستخدم أنظمة الذكاء الاصطناعي البيانات والأنماط للاستنتاج.
        en: Traditional programs follow fixed instructions, while AI systems use data and patterns to infer.
        ar_fusha: البرامج التقليدية تتبع تعليمات ثابتة، بينما تستخدم أنظمة الذكاء الاصطناعي البيانات والأنماط للاستنتاج.
    - misconception:
        ar: البيانات الكثيرة تكفي.
        en: Lots of data is enough.
        ar_fusha: البيانات الكثيرة تكفي.
      correction:
        ar: البيانات يجب أن تكون مناسبة ومتنوعة وتمثل الواقع.
        en: Data must be relevant, diverse, and representative.
        ar_fusha: البيانات يجب أن تكون مناسبة ومتنوعة وتمثل الواقع.
    - misconception:
        ar: الذكاء الاصطناعي هو المسؤول وحده عن أفعاله.
        en: AI alone is responsible for its actions.
        ar_fusha: الذكاء الاصطناعي هو المسؤول وحده عن أفعاله.
      correction:
        ar: قد يتخذ النظام قرارات، لكن المسؤولية تبقى موزعة على من يصممه وينشره ويوجهه ويستخدم نتائجه.
        en: A system may make decisions, but accountability remains with those who design, deploy, direct, and use its outputs.
        ar_fusha: قد يتخذ النظام قرارات، لكن المسؤولية تبقى موزعة على من يصممه وينشره ويوجهه ويستخدم نتائجه.
  discussion_prompts:
    - ar: وش مثال ذكاء اصطناعي مو توليدي شفته اليوم؟
      en: What non-generative AI example did you see today?
      ar_fusha: ما مثال الذكاء الاصطناعي غير التوليدي الذي رأيته اليوم؟
    - ar: وش نوع البيانات اللي يستخدمها؟
      en: What type of data does it use?
      ar_fusha: ما نوع البيانات التي يستخدمها؟
    - ar: وش ضابط الأمان المناسب له؟
      en: What safety check would be appropriate?
      ar_fusha: ما ضابط الأمان المناسب له؟
developer_notes:
  content_owner: ByteSize AI Team
  technical_owner: Platform Team
  rendering:
    default_language: ar
    default_direction: rtl
    fallback_language: ar
    english_secondary: true
    reset_answer_state_on_screen_change: true
    hide_feedback_until_answer_selected: true
    require_attention_anchor: true
    max_options_per_question: 3
    prefer_two_options: true
  screen_requirements:
    - Every screen must include media, audio, a quiz, a reveal, or an interactive component.
    - Do not render feedback, hints, or correctness states before an answer is selected.
    - Reset selectedAnswer, feedback state, and retry state whenever screen.id changes.
    - Video screens and their questions remain separate screens.
    - Missing media must render a clean placeholder without breaking the screen.
    - "Interactive components marked implementation_status: required must not ship as developer-info placeholder cards
      in production."
  interactive_components_to_build:
    - component_key: ai-capability-sorter
      behavior: Drag or tap six AI examples into recognize, predict, recommend, generate, or act.
    - component_key: data-type-sorter
      behavior: Sort examples into numbers, image/video, audio, or text.
    - component_key: pattern-detective
      behavior: Three short rounds where the learner identifies the repeated relationship.
    - component_key: ai-mission-builder
      behavior: Choose one mission, then match goal, data, pattern, output, and safeguard; generate an AI System Card.
  visualization_contract:
    expected_inputs:
      - learner_id
      - byte_id
      - screen_id
      - language
      - direction
      - config
      - media_refs
      - stage
    expected_outputs:
      - score
      - completed
      - learner_choices
      - project_output
      - event_log
  tracking_events:
    - byte_started
    - screen_completed
    - exercise_attempted
    - media_played
    - visualization_completed
    - project_started
    - project_submitted
    - reflection_submitted
    - readiness_choice_selected
    - badge_earned
    - byte_completed
  screen_design:
    screen_count: 66
  media_rules:
    - All media paths are relative to the Byte folder.
    - Use media refs inside screens instead of raw paths.
    - Missing files should render clean placeholders.
    - Videos should include captions and transcripts where possible.
    - Audio must have a visible play control and transcript or caption.
