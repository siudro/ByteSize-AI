  - id: image_trap_to_bias
    type: concept
    title:
      ar: وش علاقة هذا بالتحيّز؟
      en: What Does This Have to Do With Bias?
      ar_fusha: ما علاقة هذا بالتحيّز؟
    content:
      ar: "عندما تُعرض عليك معلومات ناقصة أو خيارات محدودة، قد تصل إلى نتيجة خاطئة بثقة. وهذا يشبه تحيّز الناجين: نحكم من
        الحالات التي نراها، وننسى الحالات الغائبة."
      en: "When you are given incomplete information or limited choices, you may reach the wrong conclusion with confidence.
        This is similar to survivorship bias: we judge from the cases we can see and forget the cases that are missing."
      ar_fusha: "عندما تُعرض عليك معلومات ناقصة أو خيارات محدودة، قد تصل إلى نتيجة خاطئة بثقة. وهذا يشبه تحيّز الناجين: نحكم
        من الحالات التي نراها، وننسى الحالات الغائبة."
    media:
      - type: image
        ref: survivorship_planes
  - id: text_real_or_ai_view
    type: exercise
    title:
      ar: وأنت تقرأ مراجعات تطبيق، لقيت تعليقين
      en: Read Both Texts
      ar_fusha: وأنت تقرأ مراجعات تطبيق، لقيت تعليقين
    question:
      ar: أي تعليق تعتقد أنه كتبه إنسان؟
      en: Which comment do you think was written by a human?
      ar_fusha: أي تعليق تعتقد أنه كتبه إنسان؟
    options:
      - id: first
        label:
          ar: يا جماعة الصراحة التطبيق مره رهيب بس مدري ليه كل شوي يعلق،، جربته امس وطلع لي نتايج غريبه شوي بس عادي يمكن انا
            ماعرفت استخدمه زين
          en: honestly this app is sooo good but idk why it keeps freezing,, i tried it yesterday and got kinda weird results but
            maybe i just didnt use it right
          ar_fusha: بصراحة، التطبيق رائع جدًا، لكنني لا أعرف لماذا يتوقف كثيرًا. جربته أمس وظهرت لي نتائج غريبة قليلًا، وربما لم
            أستخدمه بالطريقة الصحيحة.
      - id: second
        label:
          ar: وفّر التطبيق تجربة استخدام متقنة، ويعرض النتائج بأسلوب واضح ومنظّم. ومع ذلك، قد يحتاج المستخدم إلى مراجعة بعض
            الإعدادات لضمان الحصول على نتائج أكثر دقة واتساقًا.
          en: The application provides a refined user experience and presents results in a clear, well-structured manner. However,
            users may need to review certain settings to ensure greater accuracy and consistency.
          ar_fusha: وفّر التطبيق تجربة استخدام متقنة، ويعرض النتائج بأسلوب واضح ومنظّم. ومع ذلك، قد يحتاج المستخدم إلى مراجعة بعض
            الإعدادات لضمان الحصول على نتائج أكثر دقة واتساقًا.
    correct_answer: non
    feedback:
      correct:
        ar: اقرأ جيدا. الأداة قد تقلّد العامية والأخطاء، والإنسان قد يكتب بأسلوب مثالي.
        en: Read carefully. The tool may imitate slang and mistakes, and a human may write in a perfect style.
        ar_fusha: اقرأ جيدًا. قد تقلّد الأداة العامية والأخطاء، وقد يكتب الإنسان بأسلوب مثالي.
      incorrect:
        ar: اقرأ جيدا. الأداة قد تقلّد العامية والأخطاء، والإنسان قد يكتب بأسلوب مثالي.
        en: Read carefully. The tool may imitate slang and mistakes, and a human may write in a perfect style.
        ar_fusha: اقرأ جيدًا. قد تقلّد الأداة العامية والأخطاء، وقد يكتب الإنسان بأسلوب مثالي.
  - id: text_real_or_ai
    type: exercise
    title:
      ar: هل الأسلوب يكشف الكاتب؟
      en: Does Style Reveal the Writer?
      ar_fusha: هل الأسلوب يكشف الكاتب؟
    question:
      ar: هل نقدر نجزم أن أحد التعليقين كتبه إنسان والآخر كتبه ذكاء اصطناعي من الأسلوب؟
      en: Can we prove that one was written by a human and the other by AI from style alone?
      ar_fusha: هل نستطيع الجزم من الأسلوب بأن أحد التعليقين كتبه إنسان والآخر كتبه ذكاء اصطناعي؟
    options:
      - id: yes
        label:
          ar: نعم، أكيد
          en: Yes, definitely
          ar_fusha: نعم، أكيد
      - id: no
        label:
          ar: لا، ما يكفي
          en: No, not enough
          ar_fusha: لا، لا يكفي
    correct_answer: no
    feedback:
      correct:
        ar: صح. الإنسان قد يكتب بأسلوب مثالي، والذكاء الاصطناعي قد يقلّد العامية والأخطاء. نحتاج مصدرًا وسياقًا.
        en: Correct. A human may write perfectly, and AI may imitate slang and mistakes. We need source and context.
        ar_fusha: صحيح. قد يكتب الإنسان بأسلوب مثالي، وقد يقلّد الذكاء الاصطناعي العامية والأخطاء. نحتاج إلى مصدر وسياق.
      incorrect:
        ar: الأسلوب قد يخدعنا. الذكاء الاصطناعي يستطيع تقليد الفصحى والعامية وحتى الأخطاء.
        en: Style can mislead us. AI can imitate formal language, slang, and even mistakes.
        ar_fusha: الأسلوب قد يخدعنا. الذكاء الاصطناعي يستطيع تقليد الفصحى والعامية وحتى الأخطاء.
  - id: verification_action
    type: exercise
    title:
      ar: وصلك محتوى صادم
      en: You Receive Shocking Content
      ar_fusha: وصلك محتوى صادم
    question:
      ar: وش أول خطوة؟
      en: What is the first step?
      ar_fusha: ما أول خطوة؟
    options:
      - id: verify
        label:
          ar: أتحقق أولًا
          en: Verify first
          ar_fusha: أتحقق أولًا
      - id: share
        label:
          ar: أشاركه
          en: Share it
          ar_fusha: أشاركه
      - id: believe
        label:
          ar: أصدقه
          en: Believe it
          ar_fusha: أصدقه
    correct_answer: verify
    feedback:
      correct:
        ar: صحيح. افحص المصدر والسياق قبل التصديق أو المشاركة.
        en: Correct. Check the source and context before believing or sharing.
        ar_fusha: صحيح. افحص المصدر والسياق قبل التصديق أو المشاركة.
      incorrect:
        ar: تمهّل. المظهر المقنع ما يثبت الحقيقة.
        en: Pause. Convincing appearance does not prove truth.
        ar_fusha: تمهّل. المظهر المقنع ما يثبت الحقيقة.
  - id: verification_visual
    type: concept
    title:
      ar: ثلاث أسئلة تكفي كبداية
      en: Three Good First Questions
      ar_fusha: ثلاث أسئلة تكفي كبداية
    content:
      ar: من نشره؟ وين نُشر أول مرة؟ وهل أكده مصدر موثوق؟
      en: Who posted it? Where did it first appear? Has a trusted source confirmed it?
      ar_fusha: من نشره؟ أين نُشر أول مرة؟ وهل أكده مصدر موثوق؟
    media:
      - type: image
        ref: verify_source
  - id: responsible_intro
    type: concept
    title:
      ar: لا يمكنك تحميل المسؤولية على الذكاء الاصطناعي
      en: You cannot hold AI accountable
      ar_fusha: لا يمكنك تحميل المسؤولية على الذكاء الاصطناعي
    content:
      ar: قد يتخذ النظام قرارًا أو ينفذ فعلًا، لكن البشر هم من يحددون الهدف والصلاحيات والضوابط.
      en: A system may make a decision or take an action, but people define its goal, authority, and safeguards.
      ar_fusha: قد يتخذ النظام قرارًا أو ينفذ فعلًا، لكن البشر هم من يحددون الهدف والصلاحيات والضوابط.
    media:
      - type: image
        ref: responsible_ai
  - id: dangerous_scenario
    type: scenario
    title:
      ar: تنبيه إخلاء مزيف
      en: A Fake Evacuation Alert
      ar_fusha: تنبيه إخلاء مزيف
    content:
      ar: شخص استخدم الذكاء الاصطناعي لتقليد صوت جهة رسمية، وصنع تنبيه إخلاء مزيفًا أثناء كارثة ثم نشره فتسبب في ذعر وتوجيه
        الناس إلى طريق خطر.
      en: Someone used AI to imitate an official voice, created a fake evacuation alert during a disaster, and shared it,
        causing panic and directing people toward a dangerous route.
      ar_fusha: شخص استخدم الذكاء الاصطناعي لتقليد صوت جهة رسمية، وصنع تنبيه إخلاء مزيفًا أثناء كارثة ثم نشره فتسبب في ذعر
        وتوجيه الناس إلى طريق خطر.
    media:
      - type: image
        ref: emergency_alert
  - id: accountability_quiz
    type: exercise
    title:
      ar: من المسؤول؟
      en: Who Is Accountable?
      ar_fusha: من المسؤول؟
    question:
      ar: في هذا المثال، من يتحمل مسؤولية الضرر؟
      en: In this example, who is accountable for the harm?
      ar_fusha: في هذا المثال، من يتحمل مسؤولية الضرر؟
    options:
      - id: person
        label:
          ar: مستخدم الذكاء الاصطناعي
          en: The creator and sharer
          ar_fusha: مستخدم الذكاء الاصطناعي
      - id: ai
        label:
          ar: الذكاء الاصطناعي
          en: The system alone
          ar_fusha: الذكاء الاصطناعي
      - id: nobody
        label:
          ar: مطور الذكاء الاصطناعي
          en: No one
          ar_fusha: مطور الذكاء الاصطناعي
    correct_answer: person
    feedback:
      correct:
        ar: صحيح. الأداة نفذت، لكن الإنسان اختار الهدف وصنع المحتوى ونشره.
        en: Correct. The tool executed, but a person chose the goal, created the content, and shared it.
        ar_fusha: صحيح. الأداة نفذت، لكن الإنسان اختار الهدف وصنع المحتوى ونشره.
      incorrect:
        ar: الذكاء الاصطناعي قد يتصرف ضمن صلاحياته، لكن المسؤولية لا تختفي عن من صممه أو وجّهه أو نشر نتيجته.
        en: AI may act within its authority, but responsibility does not disappear from those who design, direct, or deploy it.
        ar_fusha: الذكاء الاصطناعي قد يتصرف ضمن صلاحياته، لكن المسؤولية لا تختفي عن من صممه أو وجّهه أو نشر نتيجته.
  - id: accountability_explain
    type: concept
    title:
      ar: المسؤولية لها سلسلة
      en: Responsibility Has a Chain
      ar_fusha: المسؤولية لها سلسلة
    content:
      ar: المستخدم مسؤول عن قصده واستخدامه، والجهة الناشرة مسؤولة عن الضوابط، والمطورون مسؤولون عن تقليل المخاطر المتوقعة.
      en: Users are responsible for intent and use, deploying organizations for safeguards, and developers for reducing
        foreseeable risks.
      ar_fusha: المستخدم مسؤول عن قصده واستخدامه، والجهة الناشرة مسؤولة عن الضوابط، والمطورون مسؤولون عن تقليل المخاطر المتوقعة.
    media:
      - type: image
        ref: accountability_chain
