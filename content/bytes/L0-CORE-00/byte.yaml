id: L0-CORE-00
title:
  ar: الذكاء الاصطناعي ليس سحرًا
  en: AI Is Not Magic
  ar_fusha: الذكاء الاصطناعي ليس سحرًا
subtitle:
  ar: البايت الأول في رحلة ByteSize AI
  en: The first Byte in the ByteSize AI journey
  ar_fusha: البايت الأول في رحلة ByteSize AI
level: 0
primary_pathway: core
estimated_duration_minutes: 35
status: draft
version: 2.2
language:
  default: ar
  direction: rtl
  supported:
    - ar
    - en
  fallback: ar
  default_arabic_variant: saudi
  supported_arabic_variants:
