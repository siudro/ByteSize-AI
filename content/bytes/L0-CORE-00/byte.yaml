    title:
      ar: آخر سؤال كتابي
      en: One Written Question
      ar_fusha: آخر سؤال كتابي
    prompt:
      ar: باعتقادك، ايش هو أهم شيء تعلمته اليوم؟ وكيف راح تشرحه لشخص ماحضر معنا اليوم؟
