      - type: image
        ref: ai_world_hook
  - id: intro_guess
    type: micro_check
    title:
      ar: تخمين سريع
      en: Quick Guess
      ar_fusha: تخمين سريع
    question:
      ar: هل الذكاء الاصطناعي يعني صناعة الصور والنصوص فقط؟
      en: Is AI only about making images and text?
      ar_fusha: هل الذكاء الاصطناعي يعني صناعة الصور والنصوص فقط؟
    options:
      - id: yes
        label:
          ar: نعم
          en: Yes
          ar_fusha: نعم
      - id: no
        label:
          ar: لا
          en: No
          ar_fusha: لا
    correct_answer: no
    feedback:
      correct:
        ar: صحيح. التوليد قدرة واحدة فقط من قدرات كثيرة.
        en: Correct. Generation is only one of many capabilities.
        ar_fusha: صحيح. التوليد قدرة واحدة فقط من قدرات كثيرة.
      incorrect:
        ar: "فيه أكثر بكثير: يتعرف ويتنبأ ويوصي ويتصرف أيضًا."
        en: "There is much more: AI also recognizes, predicts, recommends, and acts."
        ar_fusha: "هناك أكثر بكثير: يتعرّف ويتنبأ ويوصي ويتصرف أيضًا."
  - id: ai_definition
    type: concept
    title:
      ar: وش يعني ذكاء اصطناعي؟
      en: What Does AI Mean?
      ar_fusha: ما معنى الذكاء الاصطناعي؟
    content:
      ar: أنظمة تحاكي بعض قدرات الإنسان، مثل التعلّم والتعرّف والتوقّع والتوليد واتخاذ القرار. ونتائجها ليست ثابتة دائمًا؛ فقد
        تتغيّر حسب البيانات والسياق.
      en: Systems that imitate some human abilities, such as learning, recognizing, predicting, generating, and making
        decisions. Their results are not always fixed and may change with the data and context.
      ar_fusha: أنظمة تحاكي بعض قدرات الإنسان، مثل التعلّم والتعرّف والتوقّع والتوليد واتخاذ القرار. ونتائجها ليست ثابتة
        دائمًا؛ فقد تتغيّر حسب البيانات والسياق.
    media:
      - type: image
        ref: ai_capabilities
  - id: ai_definition
    type: reflection
    title:
      ar: أمثلة أخرى؟
      en: More example?
      ar_fusha: أمثلة أخرى؟
    prompt:
      ar: أضف أمثلة أخرى لقدرات الذكاء الاصطناعي من حولك.
      en: Add more examples of AI capabilities from the world around you.
      ar_fusha: أضف أمثلة أخرى لقدرات الذكاء الاصطناعي من حولك.
    placeholder:
      ar: "مثال: أتحقق من المعلومات..."
      en: "Example: I would verify the information..."
      ar_fusha: "مثال: أتحقق من المعلومات..."
    minimum_characters: 8
    required: true
  - id: ai_history
    type: story
    title:
      ar: الفكرة أقدم مما تتوقع
      en: Older Than You Think
      ar_fusha: الفكرة أقدم مما تتوقع
    content:
      ar: ظهر اسم «الذكاء الاصطناعي» كمجال علمي في لقاء دارتموث عام 1956.
      en: The name “artificial intelligence” emerged as a scientific field at Dartmouth in 1956.
      ar_fusha: ظهر اسم «الذكاء الاصطناعي» كمجال علمي في لقاء دارتموث عام 1956.
    media:
      - type: image
        ref: dartmouth_1956
  - id: not_every_software
    type: concept
    title:
      ar: مو كل برنامج ذكاء اصطناعي
      en: Not Every Program Is AI
      ar_fusha: ليس كل برنامج ذكاءً اصطناعيًا
    content:
      ar: "الآلة الحاسبة والمنبّه ومفتاح المصباح تعمل بناءً على برمجة وتعليمات ثابتة: إذا كررت نفس الأمر، تحصل عادةً على
        النتيجة نفسها. أما الذكاء الاصطناعي فيعتمد على البيانات والأنماط، لذلك قد تتغيّر نتائجه حسب البيانات والسياق."
      en: "A calculator, alarm, and light switch work through programming and fixed instructions: repeat the same command, and
        you usually get the same result. AI, however, relies on data and patterns, so its results may change depending
        on the data and context."
      ar_fusha: "الآلة الحاسبة والمنبّه ومفتاح المصباح تعمل بناءً على برمجة وتعليمات ثابتة: إذا كررت نفس الأمر، تحصل عادةً على
        النتيجة نفسها. أما الذكاء الاصطناعي فيعتمد على البيانات والأنماط، لذلك قد تتغيّر نتائجه حسب البيانات والسياق."
    media:
      - type: image
        ref: fixed_rules
  - id: ai_or_not
