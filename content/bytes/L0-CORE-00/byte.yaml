    required: true
  - id: explain_takeaway_timer
    type: timer
    title:
      ar: اشرحها في دقيقة
      en: Explain It in One Minute
      ar_fusha: اشرحها في دقيقة واحدة
    content:
      ar: اختر شخص قريب منك، واضغط ابدأ. عندك دقيقة تشرح فيها أهم شيء تعلمته اليوم.
      en: Pick someone near you and press Start. You have one minute to explain the most important thing you learned today.
      ar_fusha: اختر شخصًا قريبًا منك، واضغط ابدأ. لديك دقيقة واحدة لتشرح أهم شيء تعلمته اليوم.
    timer:
      duration_seconds: 60
      completion_required: true
      completion_feedback:
        ar: انتهت الدقيقة. ممتاز، الآن تقدر تكمل.
        en: The minute is done. Nice work, you can continue now.
        ar_fusha: انتهت الدقيقة. أحسنت، يمكنك المتابعة الآن.
      alert:
        stimulus:
          low:
            visual: true
            audio: false
            intensity: soft
            message:
              ar: انتهى الوقت بهدوء. تقدر تكمل الآن.
              en: Time is up. You can continue now.
              ar_fusha: انتهى الوقت بهدوء. يمكنك المتابعة الآن.
          standard:
            visual: true
            audio: true
            intensity: standard
            message:
              ar: انتهت الدقيقة. شارك آخر فكرة وتابع.
              en: One minute is up. Share your last thought, then continue.
              ar_fusha: انتهت الدقيقة. شارك فكرتك الأخيرة ثم تابع.
          high:
            visual: true
            audio: true
            intensity: high
            message:
              ar: انتهى الوقت! خذ نفس وتابع للخطوة الأخيرة.
              en: Time is up! Take a breath and move to the final step.
              ar_fusha: انتهى الوقت! خذ نفسًا وتابع إلى الخطوة الأخيرة.
    required: true
    continue_label:
      ar: كملت الشرح
      en: I explained it
      ar_fusha: أكملت الشرح
  - id: connect_happened
    type: connect_the_dots
    title:
      ar: وش تعلّمت؟
      en: What Did You Learn?
      ar_fusha: ماذا تعلمت؟
    what_happened:
      ar: شفت أن الذكاء الاصطناعي يتعرّف ويتنبأ ويوصي ويولّد ويتصرف، وكل هذا يبدأ من البيانات والأنماط.
      en: You saw that AI recognizes, predicts, recommends, generates, and acts, all beginning with data and patterns.
      ar_fusha: رأيت أن الذكاء الاصطناعي يتعرّف ويتنبأ ويوصي ويولّد ويتصرف، وكل ذلك يبدأ من البيانات والأنماط.
    media:
      - type: image
        ref: ai_capabilities
  - id: connect_matters
    type: connect_the_dots
    title:
      ar: لماذا تعلمت؟
      en: Why Does It Matter?
      ar_fusha: لماذا تعلمت؟
    why_it_matters:
      ar: لأن البيانات الناقصة قد تضلل النظام، والمحتوى المقنع قد يضللنا، والمسؤولية تبقى على البشر الذين يبنون النظام
        ويستخدمونه.
      en: Because missing data can mislead a system, convincing content can mislead us, and responsibility remains with the
        people who build and use it.
      ar_fusha: لأن البيانات الناقصة قد تضلل النظام، والمحتوى المقنع قد يضللنا، والمسؤولية تبقى على البشر الذين يبنون النظام
        ويستخدمونه.
    media:
      - type: image
        ref: accountability_chain
  - id: connect_leads
    type: connect_the_dots
    title:
      ar: وين الطريق؟
      en: What Comes Next?
      ar_fusha: إلى أين يقودك الطريق؟
    where_it_leads:
      ar: فتحت المستوى الأول. جرّب مسار المهندس أو الصانع أو المبدع أو المحترف، وخلك فضولي.
      en: You unlocked Level 1. Explore the Engineer, Maker, Creative, or Professional pathway and stay curious.
      ar_fusha: فتحت المستوى الأول. جرّب مسار المهندس أو الصانع أو المبدع أو المحترف، وابقَ فضوليًا.
    media:
      - type: image
        ref: mission_builder
  - id: readiness_check
    type: learner_feedback
    title:
      ar: جاهز تكمل؟
      en: Ready to Continue?
      ar_fusha: هل أنت جاهز للمتابعة؟
    content:
      ar: اختر اللي يناسبك. تقدمك محفوظ.
      en: Choose what works for you. Your progress is saved.
      ar_fusha: اختر ما يناسبك. تقدمك محفوظ.
    media:
      - type: image
        ref: ai_world_hook
    feedback_ref: readiness_check
  - id: badge_award
    type: badge_award
    title:
      ar: أخذت شارة المستكشف
      en: You Earned the Explorer Badge
      ar_fusha: حصلت على شارة المستكشف
    content:
      ar: أكملت المستوى صفر وفتحت المستوى الأول.
      en: You completed Level 0 and unlocked Level 1.
      ar_fusha: أكملت المستوى صفر وفتحت المستوى الأول.
    media:
      - type: image
        ref: badge_ai_explorer
    badge_ref: badge
