- id: real_or_ai_compare
  type: story
  title:
    ar: واحد حقيقي والثاني مولّد
    en: One Real, One Generated
  content:
    ar: المظهر وحده ما عاد يكفي للحكم.
    en: Appearance alone is no longer enough.
  media:
  - type: video
    ref: mystery_explained_video
- id: image_real_or_ai_view
  type: story
  title:
    ar: شوف الصورتين
    en: Look at Both Images
  content:
    ar: واحدة حقيقية والثانية مولّدة. ركّز في التفاصيل، ثم انتقل للسؤال.
    en: One is real and the other is generated. Study the details, then continue to the question.
  media:
  - type: image
    ref: generated_image_pair
- id: image_real_or_ai
  type: exercise
  title:
    ar: والصورة؟
    en: What About the Image?
  question:
    ar: أي صورة تعتقد أنها مولّدة؟
    en: Which image do you think is generated?
  options:
  - id: first
    label:
      ar: الأولى
      en: First
  - id: second
    label:
      ar: الثانية
      en: Second
  correct_answer: non
  feedback:
    correct:
      ar: ' حاول ثاني. أحيانًا يصعب جدًا التفريق بالعين فقط.'
      en: Correct. More importantly, do not rely on your eyes alone.
    incorrect:
      ar: حاول ثاني. أحيانًا يصعب جدًا التفريق بالعين فقط.
      en: That is understandable. Sometimes it is very hard to tell by eye alone.

- id: image_real_or_ai_reveal
  type: story
  title:
    ar: "الاثنتان مولّدتان بالذكاء الاصطناعي!"
    en: "Both Images Were AI-Generated!"

  content:
    ar: "وقعت في المصيدة؟ أنا قلت لك إن واحدة حقيقية والثانية مولّدة، فبدأت تبحث عن الفرق بدل أن تشك في السؤال نفسه. أحيانًا المشكلة ليست في الصورة، بل في الافتراض الذي وُضع أمامك."

    en: "Did you fall for it? I told you that one image was real and the other was generated, so you started looking for differences instead of questioning the claim itself. Sometimes the problem is not the image, but the assumption you were given."

  media:
    - type: image
      ref: generated_image_pair

- id: image_trap_to_bias
  type: concept
  title:
    ar: "وش علاقة هذا بالتحيّز؟"
    en: "What Does This Have to Do With Bias?"

  content:
    ar: "عندما تُعرض عليك معلومات ناقصة أو خيارات محدودة، قد تصل إلى نتيجة خاطئة بثقة. وهذا يشبه تحيّز الناجين: نحكم من الحالات التي نراها، وننسى الحالات الغائبة."

    en: "When you are given incomplete information or limited choices, you may reach the wrong conclusion with confidence. This is similar to survivorship bias: we judge from the cases we can see and forget the cases that are missing."

  media:
    - type: image
      ref: survivorship_planes

- id: text_real_or_ai_view
  type: exercise
  title:
    ar: وأنت تقرأ مراجعات تطبيق، لقيت تعليقين
    en: Read Both Texts
  question:
    ar: أي تعليق تعتقد أنه كتبه إنسان؟
    en: Which comment do you think was written by a human?
  options:
  - id: first
    label:
      ar: يا جماعة الصراحة التطبيق مره رهيب بس مدري ليه كل شوي يعلق،، جربته امس وطلع لي نتايج غريبه شوي بس عادي يمكن انا ماعرفت استخدمه زين
      en: honestly this app is sooo good but idk why it keeps freezing,, i tried it yesterday and got kinda weird results but maybe i just didnt use it right
  - id: second
    label:
      ar: وفّر التطبيق تجربة استخدام متقنة، ويعرض النتائج بأسلوب واضح ومنظّم. ومع ذلك، قد يحتاج المستخدم إلى مراجعة بعض الإعدادات لضمان الحصول على نتائج أكثر دقة واتساقًا.
      en: The application provides a refined user experience and presents results in a clear, well-structured manner. However, users may need to review certain settings to ensure greater accuracy and consistency.
  correct_answer: non
  feedback:
    correct:
      ar: اقرأ جيدا. الأداة قد تقلّد العامية والأخطاء، والإنسان قد يكتب بأسلوب مثالي. 
      en: Read carefully. The tool may imitate slang and mistakes, and a human may write in a perfect style.
    incorrect:
      ar: اقرأ جيدا. الأداة قد تقلّد العامية والأخطاء، والإنسان قد يكتب بأسلوب مثالي. 
      en: Read carefully. The tool may imitate slang and mistakes, and a human may write in a perfect style.
- id: text_real_or_ai
  type: exercise
  title:
    ar: هل الأسلوب يكشف الكاتب؟
    en: Does Style Reveal the Writer?
  question:
    ar: هل نقدر نجزم أن أحد التعليقين كتبه إنسان والآخر كتبه ذكاء اصطناعي من الأسلوب؟
    en: Can we prove that one was written by a human and the other by AI from style alone?
  options:
  - id: 'yes'
    label:
      ar: نعم، أكيد
      en: Yes, definitely
  - id: 'no'
    label:
      ar: لا، ما يكفي
      en: No, not enough
  correct_answer: 'no'
  feedback:
    correct:
      ar: صح. الإنسان قد يكتب بأسلوب مثالي، والذكاء الاصطناعي قد يقلّد العامية والأخطاء. نحتاج مصدرًا وسياقًا.
      en: Correct. A human may write perfectly, and AI may imitate slang and mistakes. We need source and context.
    incorrect:
      ar: الأسلوب قد يخدعنا. الذكاء الاصطناعي يستطيع تقليد الفصحى والعامية وحتى الأخطاء.
      en: Style can mislead us. AI can imitate formal language, slang, and even mistakes.
- id: verification_action
  type: exercise
  title:
    ar: وصلك محتوى صادم
    en: You Receive Shocking Content
  question:
    ar: وش أول خطوة؟
    en: What is the first step?
  options:
  - id: verify
    label:
      ar: أتحقق أولًا
      en: Verify first
  - id: share
    label:
      ar: أشاركه
      en: Share it
  - id: believe
    label:
      ar: أصدقه
      en: Believe it
  correct_answer: verify
  feedback:
    correct:
      ar: صحيح. افحص المصدر والسياق قبل التصديق أو المشاركة.
      en: Correct. Check the source and context before believing or sharing.
    incorrect:
      ar: تمهّل. المظهر المقنع ما يثبت الحقيقة.
      en: Pause. Convincing appearance does not prove truth.
- id: verification_visual
  type: concept
  title:
    ar: ثلاث أسئلة تكفي كبداية
    en: Three Good First Questions
  content:
    ar: من نشره؟ وين نُشر أول مرة؟ وهل أكده مصدر موثوق؟
    en: Who posted it? Where did it first appear? Has a trusted source confirmed it?
  media:
  - type: image
    ref: verify_source
- id: responsible_intro
  type: concept
  title:
    ar: لا يمكنك تحميل المسؤولية على الذكاء الاصطناعي
    en: You cannot hold AI accountable
  content:
    ar: قد يتخذ النظام قرارًا أو ينفذ فعلًا، لكن البشر هم من يحددون الهدف والصلاحيات والضوابط.
    en: A system may make a decision or take an action, but people define its goal, authority, and safeguards.
  media:
  - type: image
    ref: responsible_ai
- id: dangerous_scenario
  type: scenario
  title:
    ar: تنبيه إخلاء مزيف
    en: A Fake Evacuation Alert
  content:
    ar: شخص استخدم الذكاء الاصطناعي لتقليد صوت جهة رسمية، وصنع تنبيه إخلاء مزيفًا أثناء كارثة ثم نشره فتسبب في
      ذعر وتوجيه الناس إلى طريق خطر.
    en: Someone used AI to imitate an official voice, created a fake evacuation alert during a disaster, and shared
      it, causing panic and directing people toward a dangerous route.
  media:
  - type: image
    ref: emergency_alert
- id: accountability_quiz
  type: exercise
  title:
    ar: من المسؤول؟
    en: Who Is Accountable?
  question:
    ar: في هذا المثال، من يتحمل مسؤولية الضرر؟
    en: In this example, who is accountable for the harm?
  options:
  - id: person
    label:
      ar: مستخدم الذكاء الاصطناعي
      en: The creator and sharer
  - id: ai
    label:
      ar: الذكاء الاصطناعي 
      en: The system alone
  - id: nobody
    label:
      ar: مطور الذكاء الاصطناعي
      en: No one
  correct_answer: person
  feedback:
    correct:
      ar: صحيح. الأداة نفذت، لكن الإنسان اختار الهدف وصنع المحتوى ونشره.
      en: Correct. The tool executed, but a person chose the goal, created the content, and shared it.
    incorrect:
      ar: الذكاء الاصطناعي قد يتصرف ضمن صلاحياته، لكن المسؤولية لا تختفي عن من صممه أو وجّهه أو نشر نتيجته.
      en: AI may act within its authority, but responsibility does not disappear from those who design, direct,
        or deploy it.
- id: accountability_explain
  type: concept
  title:
    ar: المسؤولية لها سلسلة
    en: Responsibility Has a Chain
  content:
    ar: المستخدم مسؤول عن قصده واستخدامه، والجهة الناشرة مسؤولة عن الضوابط، والمطورون مسؤولون عن تقليل المخاطر المتوقعة.
    en: Users are responsible for intent and use, deploying organizations for safeguards, and developers for reducing
      foreseeable risks.
  media:
  - type: image
    ref: accountability_chain
- id: project_choose
  type: story
  title:
    ar: 'مهمتك: اكتشف الحريق مبكرًا'
    en: 'Your Mission: Detect a Fire Early'
  content:
    ar: 'ستبني نظامًا بسيطًا من خمس قطع: الهدف، البيانات، النمط، النتيجة، وضابط الأمان.'
    en: 'Build a simple system from five parts: goal, data, pattern, output, and safeguard.'
  media:
  - type: image
    ref: disaster_detection
- id: project_goal
  type: exercise
  title:
    ar: '1 من 5: الهدف'
    en: '1 of 5: Goal'
  question:
    ar: ما الهدف الصحيح للنظام؟
    en: What is the correct goal for the system?
  options:
  - id: early_fire
    label:
      ar: اكتشاف الحريق مبكرًا
      en: Detect fire early
  - id: make_poster
    label:
      ar: تصميم ملصق
      en: Design a poster
  correct_answer: early_fire
  feedback:
    correct:
      ar: صح. هذه هي المشكلة التي نريد حلها.
      en: Correct. That is the problem we want to solve.
    incorrect:
      ar: المهمة هنا حماية المكان عبر اكتشاف الحريق مبكرًا.
      en: The mission is to protect the area by detecting fire early.
- id: project_data
  type: exercise
  title:
    ar: '2 من 5: البيانات'
    en: '2 of 5: Data'
  question:
    ar: أي بيانات تساعد أكثر؟
    en: Which data would help most?
  options:
  - id: images_temp
    label:
      ar: صور وحرارة
      en: Images and temperature
  - id: music_names
    label:
      ar: موسيقى وأسماء
      en: Music and names
  correct_answer: images_temp
  feedback:
    correct:
      ar: صح. الصور والحرارة قد تكشفان الدخان أو الارتفاع غير المعتاد.
      en: Correct. Images and temperature may reveal smoke or unusual heat.
    incorrect:
      ar: نحتاج بيانات مرتبطة بعلامات الحريق.
      en: We need data connected to signs of fire.
- id: project_pattern
  type: exercise
  title:
    ar: '3 من 5: النمط'
    en: '3 of 5: Pattern'
  question:
    ar: أي نمط يبحث عنه النظام؟
    en: Which pattern should the system look for?
  options:
  - id: smoke_heat
    label:
      ar: دخان مع حرارة مرتفعة
      en: Smoke with rising heat
  - id: people_colors
    label:
      ar: ألوان ملابس الناس
      en: People’s clothing colors
  correct_answer: smoke_heat
  feedback:
    correct:
      ar: صح. اجتماع أكثر من علامة يجعل التنبيه أقوى.
      en: Correct. Multiple signs together make the warning stronger.
    incorrect:
      ar: ابحث عن علاقة تشير فعلًا إلى احتمال وجود حريق.
      en: Look for a relationship that actually signals possible fire.
- id: project_output
  type: exercise
  title:
    ar: '4 من 5: النتيجة'
    en: '4 of 5: Output'
  question:
    ar: ماذا يجب أن يفعل النظام عند ارتفاع الخطر؟
    en: What should the system do when risk rises?
  options:
  - id: alert_team
    label:
      ar: ينبّه فريق السلامة
      en: Alert the safety team
  - id: post_online
    label:
      ar: ينشر تنبيه الخطر للناس
      en: Post automatically
  correct_answer: alert_team
  feedback:
    correct:
      ar: صح. يرسل تنبيهًا للجهة القادرة على التحقق والتصرف.
      en: Correct. It alerts people who can verify and respond.
    incorrect:
      ar: النشر العام قد يسبب ذعرًا قبل التحقق.
      en: Public posting may cause panic before verification.
- id: project_safeguard
  type: exercise
  title:
    ar: '5 من 5: ضابط الأمان'
    en: '5 of 5: Safeguard'
  question:
    ar: ما ضابط الأمان الأفضل؟
    en: What is the best safeguard?
  options:
  - id: human_verify
    label:
      ar: يتحقق شخص قبل الإخلاء
      en: Human verifies before evacuation
  - id: auto_evacuate
    label:
      ar: يأمر بالإخلاء فورًا
      en: Order evacuation immediately
  correct_answer: human_verify
  feedback:
    correct:
      ar: صح. القرار عالي الخطورة يحتاج تحققًا ومسؤولًا واضحًا.
      en: Correct. A high-stakes decision needs verification and clear accountability.
    incorrect:
      ar: التنبيه قد يخطئ؛ الإخلاء يحتاج تحققًا سريعًا من شخص مسؤول.
      en: The alert may be wrong; evacuation needs fast verification by a responsible person.
- id: project_result
  type: project
  title:
    ar: بطاقة نظامك جاهزة
    en: Your System Card Is Ready
  content:
    ar: 'الهدف: اكتشاف الحريق مبكرًا.

      البيانات: صور ودرجات حرارة.

      النمط: دخان مع ارتفاع غير معتاد في الحرارة.

      النتيجة: تنبيه فريق السلامة.

      ضابط الأمان: يتحقق شخص مسؤول قبل قرار الإخلاء.'
    en: 'Goal: Detect fire early.

      Data: Images and temperature readings.

      Pattern: Smoke with an unusual rise in heat.

      Output: Alert the safety team.

      Safeguard: A responsible person verifies before an evacuation decision.'
  media:
  - type: image
    ref: mission_builder
  output:
    type: ai_system_card
    mission: fire_detection
    goal: detect_fire_early
    data:
    - images
    - temperature
    pattern: smoke_and_rising_heat
    output: alert_safety_team
    safeguard: human_verification_before_evacuation
  completion_message:
    ar: 'أنجزت مشروعًا واضحًا: نظام له هدف وبيانات ونمط ونتيجة وضابط أمان.'
    en: 'You completed a clear project: a system with a goal, data, pattern, output, and safeguard.'
- id: reflection
  type: reflection
  title:
    ar: آخر سؤال كتابي
    en: One Written Question
  prompt:
    ar: باعتقادك، ايش هو أهم شيء تعلمته اليوم؟ وكيف راح تشرحه لشخص ماحضر معنا اليوم؟
    en: In your opinion, what is the most important thing you learned today, and how would you explain it to someone who wasn’t here with us?
  placeholder:
    ar: 'مثال: أتحقق من المعلومات...'
    en: 'Example: I would verify the information...'
  minimum_characters: 8
  required: true
- id: connect_happened
  type: connect_the_dots
  title:
    ar: وش تعلّمت؟
    en: What Did You Learn?
  what_happened:
    ar: شفت أن الذكاء الاصطناعي يتعرّف ويتنبأ ويوصي ويولّد ويتصرف، وكل هذا يبدأ من البيانات والأنماط.
    en: You saw that AI recognizes, predicts, recommends, generates, and acts, all beginning with data and patterns.
  media:
  - type: image
    ref: ai_capabilities
- id: connect_matters
  type: connect_the_dots
  title:
    ar: لماذا تعلمت؟
    en: Why Does It Matter?
  why_it_matters:
    ar: لأن البيانات الناقصة قد تضلل النظام، والمحتوى المقنع قد يضللنا، والمسؤولية تبقى على البشر الذين يبنون النظام
      ويستخدمونه.
    en: Because missing data can mislead a system, convincing content can mislead us, and responsibility remains
      with the people who build and use it.
  media:
  - type: image
    ref: accountability_chain
- id: connect_leads
  type: connect_the_dots
  title:
    ar: وين الطريق؟
    en: What Comes Next?
  where_it_leads:
    ar: فتحت المستوى الأول. جرّب مسار المهندس أو الصانع أو المبدع أو المحترف، وخلك فضولي.
    en: You unlocked Level 1. Explore the Engineer, Maker, Creative, or Professional pathway and stay curious.
  media:
  - type: image
    ref: mission_builder
- id: readiness_check
  type: learner_feedback
  title:
    ar: جاهز تكمل؟
    en: Ready to Continue?
  content:
    ar: اختر اللي يناسبك. تقدمك محفوظ.
    en: Choose what works for you. Your progress is saved.
  media:
  - type: image
    ref: ai_world_hook
  feedback_ref: readiness_check
- id: badge_award
  type: badge_award
  title:
    ar: أخذت شارة المستكشف
    en: You Earned the Explorer Badge
  content:
    ar: أكملت المستوى صفر وفتحت المستوى الأول.
    en: You completed Level 0 and unlocked Level 1.
  media:
  - type: image
    ref: badge_ai_explorer
  badge_ref: badge
